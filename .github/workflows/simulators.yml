name: Simulators

# Runs the app itself, in simulators. A build machine needs several minutes to
# start one simulator from cold and much longer for two, so these checks take
# between ten and thirty minutes. They are kept out of the CI workflow,
# which answers in five: they run every night, on demand from the Actions tab,
# and when the tests they run are changed.
on:
  schedule:
    - cron: "17 3 * * *"
  push:
    paths:
      - "UITests/**"
      - "App/TestHarness.swift"
      - "Scripts/start-simulator.sh"
      - "Scripts/start-baby-unit.sh"
      - ".github/workflows/simulators.yml"
  workflow_dispatch:

concurrency:
  group: simulators-${{ github.sha }}

# Each job builds first and boots afterwards: a simulator that is starting up
# slows a build several times over. The tests start once the boot is over.
jobs:
  screens:
    name: Screens (${{ matrix.device }})
    runs-on: macos-26
    timeout-minutes: 25
    env:
      APP: Derived/Build/Products/Debug-iphonesimulator/Babyphone.app
    strategy:
      fail-fast: false
      matrix:
        # The smallest supported iPhone, where everything must fit, a current
        # iPhone, and an iPad.
        include:
          - device: iPhone SE
            model: iPhone SE (3rd generation)
          - device: iPhone 17
            model: iPhone 17
          - device: iPad
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Babyphone.xcodeproj \
            -scheme BabyphoneUITests \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath Derived \
            -skipPackagePluginValidation \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            | xcbeautify --quiet --renderer github-actions
      - name: Start the simulator
        run: |
          if [ "${{ matrix.device }}" = "iPad" ]; then
            # iPad model names change with every Xcode: take one this Xcode already set up.
            device=$(xcrun simctl list devices available | grep -E '^ +iPad' | head -1 | grep -oE '[0-9A-F-]{36}')
          else
            device=$(xcrun simctl create nuzzlecam-screens "${{ matrix.model }}")
          fi
          # Permissions are granted ahead of time, so no alert interrupts the tests.
          Scripts/start-simulator.sh "$device" "$APP"
          echo "DEVICE=$device" >> "$GITHUB_ENV"
      - name: Walk the screens
        run: |
          set -o pipefail
          walk() {
            xcodebuild test-without-building \
              -project Babyphone.xcodeproj \
              -scheme BabyphoneUITests \
              -destination "id=$DEVICE" \
              -derivedDataPath Derived \
              -only-testing:BabyphoneUITests/SmokeTests \
              -retry-tests-on-failure -test-iterations 2 \
              -resultBundlePath "Screens-$1.xcresult" \
              | xcbeautify --quiet --renderer github-actions
          }
          # A build machine sometimes fails to launch apps in a simulator for a while.
          # One more walk, a little later, settles it.
          walk 1 || walk 2
      - name: Export the screenshots
        if: always()
        run: |
          mkdir -p Screenshots
          for result in Screens-*.xcresult; do
            xcrun xcresulttool export attachments --path "$result" --output-path "Screenshots/${result%.xcresult}" || true
          done
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots ${{ matrix.device }}
          path: Screenshots

  two-devices:
    name: Two devices, end to end
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APP: Derived/Build/Products/Debug-iphonesimulator/Babyphone.app
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Babyphone.xcodeproj \
            -scheme BabyphoneUITests \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath Derived \
            -skipPackagePluginValidation \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            | xcbeautify --quiet --renderer github-actions
      # One simulator at a time. Two that start together starve a build machine,
      # and the pair then needs a quarter of an hour or more. The baby unit runs on
      # a current iPhone and the parent unit on the smallest one.
      - name: Start the baby unit
        run: |
          baby=$(xcrun simctl create nuzzlecam-baby "iPhone 17")
          echo "BABY=$baby" >> "$GITHUB_ENV"
          # Permissions are granted ahead of time, so no alert interrupts the session.
          Scripts/start-simulator.sh "$baby" "$APP"
          Scripts/start-baby-unit.sh "$baby" "$APP" "$RUNNER_TEMP/session-1"
      - name: Start the parent unit's simulator
        run: |
          parent=$(xcrun simctl create nuzzlecam-parent "iPhone SE (3rd generation)")
          echo "PARENT=$parent" >> "$GITHUB_ENV"
          Scripts/start-simulator.sh "$parent" "$APP"
      - name: Pair, connect and monitor
        run: |
          session() {
            # The test drives the parent unit, and follows the baby unit through the session folder.
            folder="$RUNNER_TEMP/session-$1"
            status=0
            TEST_RUNNER_NUZZLECAM_SHARED_DIR="$folder" xcodebuild test-without-building \
              -project Babyphone.xcodeproj \
              -scheme BabyphoneUITests \
              -destination "id=$PARENT" \
              -derivedDataPath Derived \
              -only-testing:BabyphoneUITests/TwoDeviceTests \
              -resultBundlePath "Parent-$1.xcresult" > "Parent-$1.log" 2>&1 || status=$?
            grep -hE "error|XCTAssert|failed|passed|Executed" "Parent-$1.log" | cut -c1-300 || true
            ls "$folder"
            # A test that was skipped also ends well. Only the baby unit's last word says the session ran.
            [ -f "$folder/baby-stopped" ] || status=1
            return $status
          }
          # A build machine sometimes fails to start a simulator's test runner.
          # One more try, with a baby unit started afresh, settles it.
          session 1 || { Scripts/start-baby-unit.sh "$BABY" "$APP" "$RUNNER_TEMP/session-2" && session 2; }
      - name: Export the screenshots
        if: always()
        run: |
          mkdir -p Screenshots
          for result in Parent-*.xcresult; do
            xcrun xcresulttool export attachments --path "$result" --output-path "Screenshots/${result%.xcresult}" || true
          done
      - name: Keep the screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-devices
          path: |
            Screenshots
            Parent-*.log
