name: TestFlight

# Archives the app and sends it to TestFlight. Started by hand from the Actions
# tab, on the branch chosen there.
#
# Signing is left to Xcode: with an App Store Connect API key it creates the
# certificates and profiles it needs, so none is stored here. Four secrets:
#   APPLE_TEAM_ID         Team ID (developer.apple.com > Membership details)
#   ASC_KEY_ID            identifier of the API key
#   ASC_ISSUER_ID         issuer identifier, shown above the list of keys
#   ASC_PRIVATE_KEY       content of the .p8 file downloaded with the key
# The key is created in App Store Connect > Users and Access > Integrations,
# with the Admin role, which Xcode needs to create certificates.
on:
  workflow_dispatch:

# One upload at a time: two runs would compete for the same build number.
concurrency:
  group: testflight

jobs:
  upload:
    name: Archive and upload
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Write the API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: printf '%s\n' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Archive
        run: |
          set -o pipefail
          # The run number is the build number: App Store Connect refuses a number it has already seen.
          xcodebuild archive \
            -project Babyphone.xcodeproj \
            -scheme Babyphone \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/NuzzleCam.xcarchive" \
            -skipPackagePluginValidation \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | xcbeautify --quiet --renderer github-actions
      - name: Upload to TestFlight
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>method</key>
          	<string>app-store-connect</string>
          	<key>destination</key>
          	<string>upload</string>
          	<key>manageAppVersionAndBuildNumber</key>
          	<false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/NuzzleCam.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/Export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            | xcbeautify --quiet --renderer github-actions
