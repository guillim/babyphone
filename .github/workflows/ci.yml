name: CI

# Every push is checked, whichever branch it lands on.
on:
  push:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# Each commit keeps its own result: a later push does not cancel the checks of an earlier one.
concurrency:
  group: ci-${{ github.sha }}

jobs:
  core:
    name: Core logic (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v5
      - name: Install SQLite headers
        run: apt-get update && apt-get install -y libsqlite3-dev
      - name: Test
        run: swift test --package-path Packages/BabyphoneKit

  strings:
    name: French and English strings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 Scripts/localizations.py

  app:
    name: App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The oldest and the newest Xcode the project supports.
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v5
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Test the core logic, and the WebRTC and network transports
        run: swift test --package-path Packages/BabyphoneKit
      - name: Build the app
        run: |
          set -o pipefail
          xcodebuild build \
            -project Babyphone.xcodeproj \
            -scheme Babyphone \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --quiet --renderer github-actions
      - name: Show resolved package versions
        run: cat Babyphone.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

  screens:
    name: Screens in the simulator
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Create the smallest supported iPhone
        run: |
          # Every screen must fit an iPhone SE. Fall back to any iPhone if this Xcode has none.
          device=$(xcrun simctl create nid-small "iPhone SE (3rd generation)" || xcrun simctl create nid-small "iPhone 17")
          # Boots and waits until the simulator is fully up, so the tests do not time out on a cold start.
          xcrun simctl bootstatus "$device" -b
          xcrun simctl list devices | grep "$device"
          echo "DEVICE=$device" >> "$GITHUB_ENV"
      - name: Walk the screens
        run: |
          set -o pipefail
          xcodebuild test \
            -project Babyphone.xcodeproj \
            -scheme Babyphone \
            -destination "id=$DEVICE" \
            -only-testing:BabyphoneUITests/SmokeTests \
            -retry-tests-on-failure -test-iterations 3 \
            -resultBundlePath Screens.xcresult \
            -skipPackagePluginValidation \
            | xcbeautify --quiet --renderer github-actions
      - name: Export the screenshots
        if: always()
        run: xcrun xcresulttool export attachments --path Screens.xcresult --output-path Screenshots
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: Screenshots

  two-phones:
    name: Two phones, end to end
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Create two simulators
        run: |
          baby=$(xcrun simctl create nid-baby "iPhone 17")
          parent=$(xcrun simctl create nid-parent "iPhone SE (3rd generation)" || xcrun simctl create nid-parent "iPhone 17")
          for device in "$baby" "$parent"; do
            # Boots and waits until the simulator is fully up. A simulator that is still
            # starting can be invisible to the build that follows.
            xcrun simctl bootstatus "$device" -b
            # Granted ahead of time, so no permission alert interrupts the session.
            xcrun simctl privacy "$device" grant camera com.guillim.babyphone
            xcrun simctl privacy "$device" grant microphone com.guillim.babyphone
          done
          xcrun simctl list devices | grep -E "nid-"
          echo "BABY=$baby" >> "$GITHUB_ENV"
          echo "PARENT=$parent" >> "$GITHUB_ENV"
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Babyphone.xcodeproj \
            -scheme Babyphone \
            -destination "id=$BABY" \
            -derivedDataPath Derived \
            -skipPackagePluginValidation \
            | xcbeautify --quiet --renderer github-actions
      - name: Pair, connect and monitor
        run: |
          side() {
            xcodebuild test-without-building \
              -project Babyphone.xcodeproj \
              -scheme Babyphone \
              -destination "id=$1" \
              -derivedDataPath Derived \
              -only-testing:"BabyphoneUITests/TwoPhoneTests/$2" \
              -resultBundlePath "$3.xcresult" > "$3.log" 2>&1
          }
          session() {
            # The two sides exchange the pairing code and their progress through this folder.
            export TEST_RUNNER_NID_SHARED_DIR="$RUNNER_TEMP/two-phones-$1"
            mkdir -p "$TEST_RUNNER_NID_SHARED_DIR"
            side "$BABY" testBabySide "Baby-$1" & baby=$!
            side "$PARENT" testParentSide "Parent-$1" & parent=$!
            status=0
            wait $baby || status=1
            wait $parent || status=1
            grep -hE "error|XCTAssert|failed|passed|Executed" "Baby-$1.log" "Parent-$1.log" | cut -c1-300 || true
            return $status
          }
          # A build machine sometimes fails to start a simulator's test runner. One more try settles it.
          session 1 || session 2
      - name: Export the screenshots
        if: always()
        run: |
          for result in Baby-*.xcresult Parent-*.xcresult; do
            xcrun xcresulttool export attachments --path "$result" --output-path "Screenshots/${result%.xcresult}" || true
          done
      - name: Keep the screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-phones
          path: |
            Screenshots
            Baby-*.log
            Parent-*.log
