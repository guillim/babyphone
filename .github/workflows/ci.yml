name: CI

# Every push is checked, whichever branch it lands on.
on:
  push:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# Each commit keeps its own result: a later push does not cancel the checks of an earlier one.
concurrency:
  group: ci-${{ github.sha }}

# This is the gate: it says within about five minutes whether a commit is sound.
# The jobs run side by side, and the limits below turn anything that stalls into
# a quick failure. Running the app in simulators takes longer on a build machine
# and has its own workflow, simulators.yml.
jobs:
  core:
    name: Core logic (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: swift:6.1
    steps:
      - uses: actions/checkout@v5
      - name: Install SQLite headers
        run: apt-get update && apt-get install -y libsqlite3-dev
      - name: Test
        run: swift test --package-path Packages/BabyphoneKit

  strings:
    name: French and English strings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python3 Scripts/localizations.py

  app:
    name: App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The oldest and the newest Xcode the project supports.
        os: [macos-15, xcode-27]
    steps:
      - uses: actions/checkout@v5
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Test the core logic, and the WebRTC and network transports
        run: Scripts/test-with-watchdog.sh 240
      - name: Repeat the transport tests
        run: |
          # A deadlock between threads only shows now and then: several rounds make one visible.
          for round in 1 2 3 4 5; do
            Scripts/test-with-watchdog.sh 90 --skip-build --filter BabyphoneTransportTests
          done
      - name: Build the app
        run: |
          set -o pipefail
          xcodebuild build \
            -project Babyphone.xcodeproj \
            -scheme Babyphone \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --quiet --renderer github-actions
      - name: Show resolved package versions
        run: cat Babyphone.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
