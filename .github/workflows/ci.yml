name: CI

# Every push is checked, whichever branch it lands on.
on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core logic (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v5
      - name: Install SQLite headers
        run: apt-get update && apt-get install -y libsqlite3-dev
      - name: Test
        run: swift test --package-path Packages/BabyphoneKit

  strings:
    name: French and English strings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 Scripts/localizations.py

  app:
    name: App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The oldest and the newest Xcode the project supports.
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v5
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Test the core logic, and the WebRTC and network transports
        run: swift test --package-path Packages/BabyphoneKit
      - name: Build the app
        run: |
          set -o pipefail
          xcodebuild build \
            -project Babyphone.xcodeproj \
            -scheme Babyphone \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --quiet --renderer github-actions
      - name: Show resolved package versions
        run: cat Babyphone.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

  screens:
    name: Screens in the simulator
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Pick the smallest supported iPhone
        run: |
          # Every screen must fit an iPhone SE. Fall back to any iPhone if the image has none.
          device=$(xcrun simctl list devices available | grep -E 'iPhone SE \(3rd generation\)' | head -1 | grep -oE '[0-9A-F-]{36}' || true)
          if [ -z "$device" ]; then
            device=$(xcrun simctl list devices available | grep -E 'iPhone' | head -1 | grep -oE '[0-9A-F-]{36}')
          fi
          xcrun simctl list devices available | grep "$device"
          echo "DEVICE=$device" >> "$GITHUB_ENV"
      - name: Walk the screens
        run: |
          set -o pipefail
          xcodebuild test \
            -project Babyphone.xcodeproj \
            -scheme Babyphone \
            -destination "id=$DEVICE" \
            -only-testing:BabyphoneUITests \
            -resultBundlePath Screens.xcresult \
            -skipPackagePluginValidation \
            | xcbeautify --quiet --renderer github-actions
      - name: Export the screenshots
        if: always()
        run: xcrun xcresulttool export attachments --path Screens.xcresult --output-path Screenshots
      - name: Print small copies of the screenshots
        if: always()
        run: |
          cat Screenshots/manifest.json || true
          for file in Screenshots/*.png; do
            small="/tmp/$(basename "$file" .png).jpg"
            sips -Z 440 -s format jpeg -s formatOptions 50 "$file" --out "$small" >/dev/null
            echo "SHOT $(basename "$file") $(base64 -i "$small")"
          done
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: Screenshots
