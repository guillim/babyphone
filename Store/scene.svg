<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="room" cx="50%" cy="46%" r="75%">
      <stop offset="0" stop-color="#27325a"/>
      <stop offset="0.55" stop-color="#141b33"/>
      <stop offset="1" stop-color="#05070d"/>
    </radialGradient>
    <radialGradient id="lamp" cx="18%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffb35c" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#ffb35c" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffb35c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55608f"/>
      <stop offset="1" stop-color="#333c66"/>
    </linearGradient>
    <linearGradient id="sack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9aa9e0"/>
      <stop offset="1" stop-color="#6674b4"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1cdb0"/>
      <stop offset="1" stop-color="#c99f86"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="48%" r="72%">
      <stop offset="0.55" stop-color="#05070d" stop-opacity="0"/>
      <stop offset="1" stop-color="#05070d" stop-opacity="0.9"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <g id="star"><path d="M0-9 2.6-2.8 9-2.6 4 1.6 5.6 8 0 4.4-5.6 8-4 1.6-9-2.6-2.6-2.8z"/></g>
  </defs>

  <rect width="1000" height="1400" fill="url(#room)"/>

  <!-- crib, seen from above -->
  <g transform="translate(500 700) rotate(-4)">
    <rect x="-330" y="-520" width="660" height="1040" rx="74" fill="#0a0e1c" opacity="0.55" filter="url(#soft)" transform="translate(18 26)"/>
    <rect x="-330" y="-520" width="660" height="1040" rx="74" fill="#8d97bd"/>
    <rect x="-330" y="-520" width="660" height="1040" rx="74" fill="none" stroke="#b9c2e2" stroke-width="5" opacity="0.7"/>
    <rect x="-290" y="-480" width="580" height="960" rx="46" fill="url(#sheet)"/>
    <!-- slat shadows along the two long sides -->
    <g fill="#6f7aa6">
      <g id="slats">
        <rect x="-322" y="-430" width="24" height="46" rx="10"/><rect x="-322" y="-340" width="24" height="46" rx="10"/>
        <rect x="-322" y="-250" width="24" height="46" rx="10"/><rect x="-322" y="-160" width="24" height="46" rx="10"/>
        <rect x="-322" y="-70" width="24" height="46" rx="10"/><rect x="-322" y="20" width="24" height="46" rx="10"/>
        <rect x="-322" y="110" width="24" height="46" rx="10"/><rect x="-322" y="200" width="24" height="46" rx="10"/>
        <rect x="-322" y="290" width="24" height="46" rx="10"/><rect x="-322" y="380" width="24" height="46" rx="10"/>
      </g>
      <use href="#slats" transform="translate(620 0)"/>
    </g>
    <!-- sheet pattern -->
    <g fill="#f4f1ea" opacity="0.13">
      <use href="#star" transform="translate(-200 -390) scale(1.6)"/><use href="#star" transform="translate(150 -410) scale(1.2)"/>
      <use href="#star" transform="translate(220 -200) scale(1.7)"/><use href="#star" transform="translate(-230 -120) scale(1.2)"/>
      <use href="#star" transform="translate(-210 330) scale(1.5)"/><use href="#star" transform="translate(215 390) scale(1.3)"/>
      <use href="#star" transform="translate(30 430) scale(1.1)"/><use href="#star" transform="translate(-60 -430) scale(1.1)"/>
    </g>

    <!-- baby -->
    <g transform="translate(-10 20) rotate(9)">
      <ellipse cx="14" cy="150" rx="170" ry="250" fill="#0a0e1c" opacity="0.35" filter="url(#soft)"/>
      <!-- arms up -->
      <path d="M-104 -60 C-190 -110 -200 -190 -168 -236" fill="none" stroke="url(#sack)" stroke-width="64" stroke-linecap="round"/>
      <path d="M104 -60 C188 -104 204 -180 176 -230" fill="none" stroke="url(#sack)" stroke-width="64" stroke-linecap="round"/>
      <circle cx="-166" cy="-250" r="33" fill="url(#skin)"/>
      <circle cx="174" cy="-244" r="33" fill="url(#skin)"/>
      <!-- sleep sack -->
      <path d="M-128 -80 C-128 -150 128 -150 128 -80 L150 250 C150 380 -150 380 -150 250 Z" fill="url(#sack)"/>
      <path d="M0 -130 L0 345" stroke="#56639f" stroke-width="5" opacity="0.7"/>
      <g fill="#f4f1ea" opacity="0.5">
        <use href="#star" transform="translate(-70 10) scale(1.5)"/><use href="#star" transform="translate(66 80) scale(1.2)"/>
        <use href="#star" transform="translate(-60 190) scale(1.2)"/><use href="#star" transform="translate(74 260) scale(1.6)"/>
        <use href="#star" transform="translate(64 -50) scale(1)"/><use href="#star" transform="translate(-84 300) scale(1)"/>
      </g>
      <!-- head -->
      <circle cx="0" cy="-232" r="118" fill="url(#skin)"/>
      <path d="M-100 -292 C-78 -372 78 -376 102 -288 C62 -330 -52 -334 -100 -292z" fill="#6b4a3c"/>
      <path d="M-8 -352 C-2 -382 26 -384 22 -356" fill="none" stroke="#6b4a3c" stroke-width="12" stroke-linecap="round"/>
      <path d="M-62 -222 q20 18 40 0" fill="none" stroke="#5a3b30" stroke-width="8" stroke-linecap="round"/>
      <path d="M22 -222 q20 18 40 0" fill="none" stroke="#5a3b30" stroke-width="8" stroke-linecap="round"/>
      <ellipse cx="-70" cy="-186" rx="20" ry="13" fill="#e79a8a" opacity="0.55"/>
      <ellipse cx="70" cy="-186" rx="20" ry="13" fill="#e79a8a" opacity="0.55"/>
      <path d="M-13 -170 q13 10 26 0" fill="none" stroke="#a8604f" stroke-width="7" stroke-linecap="round"/>
    </g>

  </g>

  <!-- night-time grade, lamp glow, vignette -->
  <rect width="1000" height="1400" fill="#0b1230" opacity="0.38"/>
  <rect width="1000" height="1400" fill="url(#lamp)"/>
  <rect width="1000" height="1400" fill="url(#vig)"/>
</svg>
